providers:
  bmkg_earthquake:
    enabled: true
    base_url: https://data.bmkg.go.id
    path: /DataMKG/TEWS/autogempa.json
    allowed_hosts: [data.bmkg.go.id]
    content_types: [application/json, text/json]
    max_bytes: 1048576
    attribution: BMKG
  bmkg_weather:
    enabled: true
    base_url: https://api.bmkg.go.id
    path: /publik/prakiraan-cuaca
    allowed_hosts: [api.bmkg.go.id]
    content_types: [application/json, text/json]
    max_bytes: 4194304
    attribution: BMKG
  world_bank:
    enabled: true
    base_url: https://api.worldbank.org
    allowed_hosts: [api.worldbank.org]
    content_types: [application/json, text/json]
    max_bytes: 4194304
    attribution: World Bank
  binance_market_data:
    enabled: true
    base_url: https://data-api.binance.vision
    allowed_hosts: [data-api.binance.vision]
    content_types: [application/json, text/json]
    max_bytes: 4194304
    attribution: Binance public market data
  binance_futures_context:
    enabled: true
    base_url: https://fapi.binance.com
    allowed_hosts: [fapi.binance.com]
    content_types: [application/json, text/json]
    max_bytes: 2097152
    attribution: Binance public USD-M futures market data
  ecb_fx_reference_rates:
    enabled: true
    base_url: https://www.ecb.europa.eu
    path: /stats/eurofxref/eurofxref-hist-90d.xml
    allowed_hosts: [www.ecb.europa.eu]
    content_types: [text/xml, application/xml]
    max_bytes: 2097152
    attribution: European Central Bank
  cftc_tff:
    enabled: true
    base_url: https://publicreporting.cftc.gov
    path: /resource/gpe5-46if.json
    allowed_hosts: [publicreporting.cftc.gov]
    content_types: [application/json, text/json]
    max_bytes: 2097152
    attribution: U.S. Commodity Futures Trading Commission
  bls_economic_calendar:
    enabled: true
    base_url: https://www.bls.gov
    path: /schedule/news_release/bls.ics
    allowed_hosts: [www.bls.gov]
    content_types: [text/calendar, text/plain]
    max_bytes: 2097152
    attribution: U.S. Bureau of Labor Statistics
  bps_webapi:
    enabled: true
    base_url: https://webapi.bps.go.id
    allowed_hosts: [webapi.bps.go.id]
    content_types: [application/json, text/json]
    max_bytes: 4194304
    requires_secret: BPS_API_KEY
    attribution: BPS Statistics Indonesia
  fred:
    enabled: true
    base_url: https://api.stlouisfed.org
    allowed_hosts: [api.stlouisfed.org]
    content_types: [application/json, text/json]
    max_bytes: 4194304
    requires_secret: FRED_API_KEY
    attribution: Federal Reserve Bank of St. Louis
  federal_reserve_news:
    enabled: true
    base_url: https://www.federalreserve.gov
    path: /feeds/press_all.xml
    allowed_hosts: [www.federalreserve.gov]
    content_types: [text/xml, application/xml, application/rss+xml]
    max_bytes: 2097152
    attribution: Board of Governors of the Federal Reserve System
  bis_news:
    enabled: true
    base_url: https://www.bis.org
    path: /doclist/all_pressrels.rss
    allowed_hosts: [www.bis.org]
    content_types: [text/xml, application/xml, application/rss+xml, application/rdf+xml]
    max_bytes: 2097152
    attribution: Bank for International Settlements
  ecb_news:
    enabled: true
    base_url: https://www.ecb.europa.eu
    path: /rss/press.html
    allowed_hosts: [www.ecb.europa.eu]
    content_types: [text/xml, application/xml, application/rss+xml]
    max_bytes: 2097152
    attribution: European Central Bank
