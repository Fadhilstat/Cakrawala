name: Model backtest

on:
  pull_request:
    paths:
      - 'src/cakrawala/models/**'
      - 'src/cakrawala/data/providers/binance.py'
      - 'scripts/run_model_backtest.py'
      - 'tests/test_direction_baseline.py'
      - 'pyproject.toml'
      - '.github/workflows/model-backtest.yml'
  schedule:
    - cron: '30 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  btc-direction-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[backtest]'
      - run: python scripts/check_no_em_dash.py
      - run: pytest tests/test_direction_baseline.py
      - name: Run live Binance walk-forward backtest
        run: python scripts/run_model_backtest.py
      - name: Write backtest summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('artifacts/backtests/btc_direction_latest.json').read_text())
          lines = [
              '## BTC direction baseline',
              '',
              f"- Test observations: {data['observations']}",
              f"- Test window: {data['test_start']} to {data['test_end']}",
              f"- Accuracy: {data['classification']['accuracy']:.3f}",
              f"- Balanced accuracy: {data['classification']['balanced_accuracy']:.3f}",
              f"- Brier score: {data['classification']['brier_score']:.4f}",
              f"- Baseline Brier: {data['baseline']['brier_score']:.4f}",
              f"- Strategy total return after costs: {data['strategy']['total_return']:.2%}",
              f"- Buy and hold total return after costs: {data['buy_and_hold']['total_return']:.2%}",
              f"- Strategy max drawdown: {data['strategy']['max_drawdown']:.2%}",
              f"- Promotion gate: {'PASS' if data['promotion']['promoted'] else 'FAIL'}",
              f"- Promotion reasons: {', '.join(data['promotion']['reasons']) or 'none'}",
              '',
              'Research only. A passing or failing result does not enable live trading.',
          ]
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: btc-direction-backtest
          path: artifacts/backtests/btc_direction_latest.json
          if-no-files-found: error
          retention-days: 30
