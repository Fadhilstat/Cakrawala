name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q src scripts app
      - run: python scripts/check_no_em_dash.py
      - run: python -c "from cakrawala.terminal.enhanced_ui import run; assert callable(run)"
      - run: ruff check .
      - run: pytest
