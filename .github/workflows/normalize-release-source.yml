name: Normalize release source
# One-time trigger after the workflow is available on the default branch.

on:
  push:
    branches:
      - chore/normalize-release-source
    paths:
      - .github/workflows/normalize-release-source.yml

permissions:
  contents: write

concurrency:
  group: normalize-release-source
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild verified release archive
        shell: bash
        run: |
          set -euo pipefail

          test -d .release3
          find .release3 -maxdepth 1 -type f -name 'part-*' -print | sort > /tmp/release_parts.txt
          test -s /tmp/release_parts.txt

          while IFS= read -r part; do
            cat "$part"
          done < /tmp/release_parts.txt | tr -d '\r\n' | base64 --decode > /tmp/cakrawala-release.tar.xz

          xz --test /tmp/cakrawala-release.tar.xz
          mkdir -p /tmp/cakrawala-release
          tar -xJf /tmp/cakrawala-release.tar.xz -C /tmp/cakrawala-release

          source_root="$(find /tmp/cakrawala-release -maxdepth 2 -type f -name pyproject.toml -printf '%h\n' | head -n 1)"
          test -n "$source_root"
          test -d "$source_root/src/cakrawala"
          test -f "$source_root/app/streamlit_app.py"
          test -d "$source_root/configs"
          test -d "$source_root/tests"
          test -d "$source_root/docs"

          printf 'SOURCE_ROOT=%s\n' "$source_root" >> "$GITHUB_ENV"

      - name: Replace packaging artifacts with source tree
        shell: bash
        run: |
          set -euo pipefail

          rsync -a --exclude '.git/' "$SOURCE_ROOT/" ./
          rm -rf .bootstrap .release .release2 .release3
          rm -f .release-anchor
          rm -f .github/workflows/normalize-release-source.yml

      - name: Verify repository structure
        shell: bash
        run: |
          set -euo pipefail

          test -f pyproject.toml
          test -f README.md
          test -f app/streamlit_app.py
          test -d src/cakrawala
          test -d configs
          test -d scripts
          test -d tests
          test -d docs
          test -d .github/workflows

          test ! -e .bootstrap
          test ! -e .release
          test ! -e .release2
          test ! -e .release3
          test ! -e .release-anchor

      - name: Run lightweight integrity checks
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q src scripts app
          python scripts/check_no_em_dash.py

          if grep -RInE --exclude-dir=.git --exclude='*.lock' '(AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' .; then
            echo 'Potential hard-coded secret detected.' >&2
            exit 1
          fi

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run project quality gates
        shell: bash
        run: |
          set -euo pipefail

          PYTHONPATH=src pytest -q
          ruff check .

          if command -v mypy >/dev/null 2>&1; then
            mypy src
          fi

      - name: Commit normalized source tree
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- app configs docs migrations scripts src tests .github pyproject.toml requirements.txt README.md SECURITY.md LICENSE .gitignore 2>/dev/null || true
          git add -u -- .bootstrap .release .release2 .release3 .release-anchor .github/workflows/normalize-release-source.yml 2>/dev/null || true

          if git diff --cached --quiet; then
            echo 'No normalization changes were produced.' >&2
            exit 1
          fi

          git commit -m 'Normalize repository source tree [skip ci]'
          git push origin HEAD:chore/normalize-release-source
