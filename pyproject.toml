[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cakrawala-intelligence-terminal"
version = "0.2.1"
description = "Open-data intelligence terminal for public evidence and owner-only research workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Authlib>=1.3.2,<2",
  "PyYAML>=6.0,<7",
  "dash>=3.2,<4",
  "gunicorn>=23,<24",
  "pandas>=2.2,<4",
  "plotly>=5.24,<7",
  "psycopg[binary]>=3.2,<4",
  "streamlit>=1.42,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-PyYAML>=6.0,<7",
]
models = [
  "arch>=7.2,<8",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
  "lightgbm>=4.5,<5",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["cakrawala*", "app*", "configs*", "data*"]
exclude = ["tests*", "api*", "migrations*", "docs*", "scripts*"]

[tool.setuptools.package-data]
app = ["assets/*.css"]
configs = ["*.yaml"]
"data.ai_briefs" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_cast = true
check_untyped_defs = true
